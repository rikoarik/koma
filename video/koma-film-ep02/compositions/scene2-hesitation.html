<script>
(() => {
  const tl = gsap.timeline({ paused: true });

  // Scene 2 entrance (0.0s - 0.35s)
  tl.fromTo('#s2-kicker', { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: 'power2.out' }, 0.05);
  tl.fromTo('#s2-title', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 0.1);
  tl.fromTo('#s2-card', { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 0.15);

  // The hesitation pause: cursor stays still
  tl.fromTo('#s2-cursor', { opacity: 1 }, { opacity: 0, duration: 0.35, repeat: 4, yoyo: true, ease: 'steps(1)' }, 0.2);

  // Selection highlight sweeps over text at 1.5s ("Udah dibaca ulang...")
  tl.to('#s2-hl', { opacity: 0.15, duration: 0.25, ease: 'power2.inOut' }, 1.5);

  // At 2.7s: "Hah, nggak jadi dikirim" -> strikethrough strikes!
  tl.fromTo('#s2-strike', { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: 'power3.out' }, 2.65);

  // Stamp slams down at 2.95s
  tl.fromTo('#s2-stamp', { scale: 1.6, rotation: -8, opacity: 0 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.22, ease: 'back.out(1.8)' }, 2.9);

  // Rapid deletion: text backspaces rapidly at 3.3s - 4.3s
  const original = "Sebenarnya kemarin gue cuma pengen nanya kabar lu, tapi...";
  const textEl = document.getElementById('s2-text');
  const counterEl = document.getElementById('s2-counter');
  tl.to({ len: original.length }, {
    len: 0,
    duration: 1.0,
    ease: 'power1.in',
    onUpdate: function() {
      const cur = Math.floor(this.targets()[0].len);
      if (textEl) {
        textEl.innerHTML = original.substring(0, cur) + '<span class="cursor-pipe" id="s2-cursor-del"></span>';
      }
      if (counterEl) {
        counterEl.textContent = cur + " KARAKTER";
      }
    }
  }, 3.25);

  // Hide strike & stamp as deletion finishes
  tl.to(['#s2-strike', '#s2-stamp', '#s2-hl'], { opacity: 0, duration: 0.2 }, 4.35);

  // Transition out to Scene 3 (5.0s - 5.3s)
  tl.to('#s2-canvas', { opacity: 0, scale: 0.96, duration: 0.28, ease: 'power2.in' }, 5.02);

  tl.set({}, {}, 5.3);
  window.__timelines = window.__timelines || {};
  window.__timelines['scene2'] = tl;
})();
</script>
