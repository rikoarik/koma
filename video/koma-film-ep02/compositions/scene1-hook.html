<script>
(() => {
  const tl = gsap.timeline({ paused: true });

  // Frame 0 has hook already on screen (TikTok thumbnail rule)
  tl.set('#s1-meta', { opacity: 1, y: 0 });
  tl.set('#s1-title', { opacity: 1, y: 0 });
  tl.fromTo('#s1-tape', { scaleX: 0.9, rotation: -3 }, { scaleX: 1, rotation: -1.5, duration: 0.35, ease: 'back.out(1.3)' }, 0.05);
  tl.fromTo('#s1-sheet', { y: 30, opacity: 0.9 }, { y: 0, opacity: 1, duration: 0.35, ease: 'power2.out' }, 0.05);

  // Typing effect on the draft text (0.4s to 2.4s)
  const fullText = "Sebenarnya kemarin gue cuma pengen nanya kabar lu, tapi...";
  const textEl = document.getElementById('s1-text');
  tl.to({ count: 0 }, {
    count: fullText.length,
    duration: 1.8,
    ease: 'none',
    onUpdate: function() {
      const idx = Math.floor(this.targets()[0].count);
      if (textEl) textEl.textContent = fullText.substring(0, idx);
    }
  }, 0.5);

  // Blinking cursor
  tl.fromTo('#s1-cursor', { opacity: 1 }, { opacity: 0, duration: 0.3, repeat: 9, yoyo: true, ease: 'steps(1)' }, 0.2);

  // Transition out to Scene 2 (3.5s - 3.8s)
  tl.to('#s1-canvas', { opacity: 0, y: -40, duration: 0.28, ease: 'power2.in' }, 3.52);

  tl.set({}, {}, 3.8);
  window.__timelines = window.__timelines || {};
  window.__timelines['scene1'] = tl;
})();
