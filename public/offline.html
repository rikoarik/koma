<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F7F4EE">
  <title>Offline — Koma</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 32px; background: #F7F4EE; color: #1D1B18; font-family: Georgia, serif; }
    main { max-width: 440px; width: 100%; border-top: 2px solid #1D1B18; padding-top: 20px; }
    .mark { width: 48px; height: 48px; display: block; margin-bottom: 40px; }
    h1 { font-size: clamp(2rem, 8vw, 3.2rem); font-weight: 400; line-height: 1.08; margin: 0 0 18px; }
    p { font: 1rem/1.6 Arial, sans-serif; color: #4D4742; margin: 0 0 28px; }
    a { display: inline-block; color: #F7F4EE; background: #1D1B18; padding: 12px 18px; font: 700 0.875rem/1.3 Arial, sans-serif; text-decoration: none; }
    a:focus-visible { outline: 3px solid #5A46D6; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Koma"><rect width="32" height="32" rx="7" fill="#5A46D6"/><path fill="#F7F4EE" d="M9.82 11.5a7.68 7.68 0 0 1 15.36 0c0 6.912-3.6864 13.1328-15.36 17.28 2.304-2.592 6-6.72 6.48-9.6 0-.48-6.48-1.92-6.48-7.68Z"/></svg>
    <h1>Lagi nggak tersambung.</h1>
    <p>Koma perlu koneksi untuk menampilkan coretan terbaru. Cek internetmu, lalu coba lagi.</p>
    <a href="/">Coba lagi</a>
  </main>
</body>
</html>
